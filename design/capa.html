<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1080px;overflow:hidden;font-family:"Plus Jakarta Sans",sans-serif;color:#fff;
 background:radial-gradient(900px 700px at 95% -10%, #6A01E2 0%, transparent 60%),radial-gradient(700px 500px at -10% 110%, #8D1EFC55 0%, transparent 60%),linear-gradient(170deg,#32025C 0%,#1C0136 100%)}
.orbita{position:absolute;inset:0}
.wrap{position:relative;height:100%;padding:84px 88px;display:flex;flex-direction:column}
.logo{height:74px;align-self:flex-start}
.pill{margin-top:auto;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:#ffffff14;border:1.5px solid #ffffff33;border-radius:99px;padding:12px 24px;font-weight:700;font-size:24px;letter-spacing:.14em;text-transform:uppercase}
.pill i{width:12px;height:12px;border-radius:50%;background:#8D1EFC;box-shadow:0 0 18px #8D1EFC}
h1{margin-top:30px;font-weight:800;font-size:var(--t,92px);line-height:1.02;letter-spacing:-.035em}
h1 em{font-style:normal;color:#B57BFF}
.sub{margin-top:26px;font-size:36px;font-weight:500;line-height:1.3;color:#E5D6FF;max-width:860px}
.chips{margin-top:46px;display:flex;flex-wrap:wrap;gap:14px}
.chip{background:#ffffff12;border:1.5px solid #ffffff26;border-radius:16px;padding:14px 22px;font-size:25px;font-weight:700}
.chip b{color:#B57BFF}
.tag{position:absolute;top:84px;right:88px;font-size:22px;font-weight:700;letter-spacing:.12em;color:#ffffffaa;text-transform:uppercase}
</style></head><body>
<svg class="orbita" viewBox="0 0 1080 1080"><g fill="none" stroke-linecap="round">
<ellipse cx="900" cy="230" rx="430" ry="120" transform="rotate(-24 900 230)" stroke="#8D1EFC" stroke-opacity=".55" stroke-width="10"/>
<ellipse cx="900" cy="230" rx="560" ry="170" transform="rotate(-24 900 230)" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/></g>
<path transform="translate(880 210) scale(2.4)" fill="#8D1EFC" d="M0-22C3-6 6-3 22 0 6 3 3 6 0 22-3 6-6 3-22 0-6-3-3-6 0-22Z"/></svg>
<div class="wrap">
<img class="logo" src="LOGO">
<span class="tag">TAG</span>
<span class="pill"><i></i>PILL</span>
<h1>TITULO</h1>
<p class="sub">SUB</p>
<div class="chips">CHIPS</div>
</div></body></html>
